<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfecea"></stop>
      <stop offset="100%" stop-color="#96DED1"></stop>
    </linearGradient>

    <!-- 轻微代码纹理（非常淡） -->
    <pattern id="code" width="80" height="80" patternUnits="userSpaceOnUse">
      <text x="10" y="40" font-size="14" fill="#ffffff" opacity="0.08">{ }</text>
      <text x="40" y="70" font-size="14" fill="#ffffff" opacity="0.08">&lt;&gt;</text>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" fill="url(#bg)"></rect>

  <!-- 主轮（控制在约 65%） -->
  <g transform="translate(256,256)">
    
    <!-- 外圈 -->
    <circle r="160" fill="none" stroke="#ffffff" stroke-width="16"></circle>

    <!-- 内部淡纹理 -->
    <circle r="140" fill="url(#code)"></circle>

    <!-- 辐条（4根，保证小尺寸可见） -->
    <line x1="0" y1="0" x2="0" y2="-140" stroke="#ffffff" stroke-width="10" stroke-linecap="round"></line>
    <line x1="0" y1="0" x2="120" y2="0" stroke="#ffffff" stroke-width="10" stroke-linecap="round"></line>
    <line x1="0" y1="0" x2="0" y2="140" stroke="#ffffff" stroke-width="10" stroke-linecap="round"></line>
    <line x1="0" y1="0" x2="-120" y2="0" stroke="#ffffff" stroke-width="10" stroke-linecap="round"></line>

    <!-- 中心轴 -->
    <circle r="28" fill="#ffffff"></circle>

  </g>

  <!-- 小几何点缀（控制在安全边距内） -->
  <circle cx="380" cy="120" r="10" fill="#ffffff" opacity="0.9"></circle>
  <rect x="120" y="380" width="16" height="16" fill="#ffffff" opacity="0.7" transform="rotate(20 128 388)"></rect>

</svg>